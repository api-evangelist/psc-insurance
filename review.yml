actions:
  openapiDirectoryCreated: false
  apisListed: 0
  reason: |
    No real, documented, public API exists for PSC Insurance, so apis[] is empty and
    the openapi/ directory is omitted entirely rather than populated with anything
    inferred. Recording the absence accurately is the intended outcome for this
    sector and this tier. The two live machine-facing surfaces (Auth0 identity,
    Sanity Content Lake) are recorded as artifacts and common[] pointers rather than
    as apis[] entries, because neither is a PSC-published API product and neither has
    a human-readable documentation URL to carry as humanURL.
enrichment:
- date: '2026-07-25'
  round: '2026-06-20 pipeline contract'
  artifactsAdded:
  - well-known/psc-insurance-well-known.yml
  - well-known/psc-insurance-security.txt
  - well-known/psc-insurance-openid-configuration.json
  - well-known/psc-insurance-oauth-authorization-server.json
  - well-known/psc-insurance-jwks.json
  - authentication/psc-insurance-authentication.yml
  - scopes/psc-insurance-scopes.yml
  - conformance/psc-insurance-conformance.yml
  - conventions/psc-insurance-conventions.yml
  - data-model/psc-insurance-data-model.yml
  - asyncapi/psc-insurance-content-lake-asyncapi.yml
  - lifecycle/psc-insurance-lifecycle.yml
  - security/psc-insurance-domain-security.yml
  - security/psc-insurance-vulnerability-disclosure.yml
  - llms/psc-insurance-llms.txt
  skipped:
    openapi: no OpenAPI or Swagger exists on any host after full contract discovery
    graphql: no GraphQL surface on the site or in the Sanity project
    packages: no first-party client library on any registry, no GitHub organisation
    mcp: no MCP server, and no OpenAPI to derive candidate tools from
    skills: no OpenAPI to ground agent skills in
    cli: no first-party CLI
    sandbox: no sandbox, test credentials or test values published
    changelog: no dated changelog
    components: no embeddable UI component library
    errors: no error reference and no spec to derive problem types from
    overlays: nothing to overlay
    grpc: no .proto published
    trustCenter: no trust centre found at any candidate host or path
  keyFinding: |
    The Sanity Content Lake dataset behind www.pscinsurance.com.au is publicly
    readable and was missed by the first pass. It does not change the API verdict —
    it is undocumented vendor infrastructure holding marketing content — but it is
    the only queryable machine-readable data surface the company has, and it carries
    a real event stream.
